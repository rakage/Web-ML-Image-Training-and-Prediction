{% extends 'base.html' %}

{% block title %}Image List - ML Image Annotation{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4 text-center">Your Uploaded Images</h2>
            <div id="image-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Images will be loaded here dynamically -->
            </div>
        </div>
        <div class="col-12 mt-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <h3 class="text-center mb-3">Select Folder and Add Images</h3>
                    <select id="folder-select" class="form-control mb-3">
                        <option value="" disabled selected>Select a Folder</option>
                    </select>
                    <div class="text-center">
                        <button id="add-to-folder-btn" class="btn btn-primary" onclick="addToFolder()">Add to Folder</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const authToken = "{{ auth_token }}"; // Get the JWT token passed from Django view

        if (!authToken) {
            alert('Authorization token is missing. Please login first.');
            return;
        }

        // Fetch folders from the Flask API
        fetch('http://127.0.0.1:5000/folders', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(folders => {
            const folderSelect = document.getElementById('folder-select');
            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.folder_id;
                option.textContent = folder.folder_name;
                folderSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Error fetching folders:', error);
        });

        // Fetch images from the Flask API with the Authorization header
        fetch('http://localhost:5000/images', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            const imageContainer = document.getElementById('image-container');

            // If no images are available, show a message
            if (data.length === 0) {
                imageContainer.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info text-center">
                            No images uploaded yet. <a href="{% url 'upload' %}" class="btn btn-primary ml-2">Upload an Image</a>
                        </div>
                    </div>
                `;
            } else {
                // Loop through the images and display them with checkboxes
                data.forEach(image => {
                    const imageCard = `
                        <div class="col" id="image-card-${image.image_id}">
                            <div class="card h-100 shadow-sm">
                                <div class="card-img-top-wrapper position-relative">
                                    <img id="image-${image.image_id}" class="card-img-top img-fluid" alt="${image.filename}" style="object-fit: cover; height: 250px; width: 100%;" />
                                    <input type="checkbox" class="image-checkbox position-absolute top-0 start-0 m-2" value="${image.image_id}" />
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title text-truncate">${image.filename}</h5>
                                    <p class="card-text text-muted small">Uploaded on: ${new Date(image.upload_date).toLocaleDateString()}</p>
                                    <div class="mt-auto">
                                        <button class="btn btn-danger btn-sm w-100" onclick="deleteImage('${image.image_id}')">Delete</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    imageContainer.innerHTML += imageCard;

                    // Fetch the image data and set it as the src for the <img> tag
                    fetchImage(`http://localhost:5000/image/${image.image_id}`, authToken, `#image-${image.image_id}`);
                });
            }
        })
        .catch(error => {
            console.error('Error fetching images:', error);
            const imageContainer = document.getElementById('image-container');
            imageContainer.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger text-center">
                        Failed to load images. Please try again later.
                    </div>
                </div>
            `;
        });
    });

    // Function to fetch image using the Bearer token
    function fetchImage(imageUrl, token, imageElementId) {
        fetch(imageUrl, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to fetch image');
            }
            return response.blob();  // Return the image as a Blob
        })
        .then(imageBlob => {
            const imgElement = document.querySelector(imageElementId);
            imgElement.src = URL.createObjectURL(imageBlob);  // Set the blob URL as the image source
        })
        .catch(error => {
            console.error('Error loading image:', error);
        });
    }

    // Function to delete image
    function deleteImage(imageId) {
        const authToken = "{{ auth_token }}"; // Get the JWT token passed from Django view

        if (!authToken) {
            alert('Authorization token is missing. Please login first.');
            return;
        }

        // Confirm deletion
        if (!confirm("Are you sure you want to delete this image?")) {
            return;
        }

        // Make the DELETE request to the Flask API
        fetch(`http://localhost:5000/image/${imageId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === "Image deleted successfully") {
                // Remove the image card from the UI
                const imageCard = document.getElementById(`image-card-${imageId}`);
                imageCard.remove();
            } else {
                alert("Failed to delete image. Please try again.");
            }
        })
        .catch(error => {
            console.error('Error deleting image:', error);
            alert("An error occurred while deleting the image.");
        });
    }

    // Function to add selected images to the folder
    function addToFolder() {
        const authToken = "{{ auth_token }}"; // Get the JWT token passed from Django view

        if (!authToken) {
            alert('Authorization token is missing. Please login first.');
            return;
        }

        const selectedImageIds = [];
        const checkboxes = document.querySelectorAll('.image-checkbox:checked');
        
        checkboxes.forEach(checkbox => {
            selectedImageIds.push(checkbox.value);
        });

        if (selectedImageIds.length === 0) {
            alert('Please select at least one image.');
            return;
        }

        const folderId = document.getElementById('folder-select').value;

        if (!folderId) {
            alert('Please select a folder.');
            return;
        }

        const requestBody = {
            image_ids: selectedImageIds,
            folder_id: folderId
        };

        // Make the POST request to add the images to the folder
        fetch('http://127.0.0.1:5000/add-to-folder', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === "Images added to folder successfully") {
                alert("Images added to folder successfully!");
            } else {
                alert("Failed to add images to folder.");
            }
        })
        .catch(error => {
            console.error('Error adding images to folder:', error);
            alert("An error occurred while adding images to the folder.");
        });
    }
</script>

{% endblock %}
